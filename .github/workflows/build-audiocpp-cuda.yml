# Repo de builds: .github/workflows/build-audiocpp-cuda.yml
#
# Compila 0xShug0/audio.cpp para Ubuntu x64 + CUDA 13.x sin forkear el repo.
# Las opciones de CMake salen del PKGBUILD audio.cpp-cuda-git (modo CI):
# CPU_ALL_VARIANTS + NATIVE_CPU=OFF + arquitecturas CUDA explícitas.
name: audio.cpp - Ubuntu x64 CUDA 13

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, rama o commit de 0xShug0/audio.cpp a compilar'
        default: 'main'
      cuda_arch:
        description: 'CUDA archs (ej. "86", "86-real" o la lista del PKGBUILD "75-virtual;80-virtual;86-real;89-real;120a-real;121a-real")'
        default: '86'
      publish_release:
        description: 'Publicar los paquetes en un Release de este repo'
        type: boolean
        default: false

permissions:
  contents: write   # crear Release en ESTE repo

env:
  UPSTREAM_REPO: 0xShug0/audio.cpp
  UPSTREAM_REF: ${{ inputs.ref }}
  CUDA_ARCH: ${{ inputs.cuda_arch }}
  CUDA_LABEL: '13.4'

jobs:
  build:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.1-devel-ubuntu24.04   # misma imagen que usa llama.cpp

    defaults:
      run:
        shell: bash   # los jobs en contenedor usan dash por defecto

    steps:
      # el contenedor no trae git: instalarlo antes del checkout
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Clone audio.cpp
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: src
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          cd src
          echo "name=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)"            >> "$GITHUB_OUTPUT"
          echo "arch=${CUDA_ARCH//;/-}"               >> "$GITHUB_OUTPUT"

      # Sin libssl-dev: el PKGBUILD usa el BoringSSL integrado (no USE_SYSTEM_OPENSSL)
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build patchelf python3 curl perl

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: audiocpp-ubuntu-24.04-cuda-${{ env.CUDA_LABEL }}
          evict-old-files: 1d
          max-size: "1G"

      # Flags del PKGBUILD (rama CI):
      #  ENGINE_ENABLE_CPU_ALL_VARIANTS=ON  variantes de CPU elegidas en runtime
      #       => libs ggml/backends compartidas junto a los binarios ($ORIGIN)
      #  ENGINE_ENABLE_NATIVE_CPU=OFF       sin -march=native del runner
      #  GGML_CUDA_FA_ALL_QUANTS=ON         FlashAttention para todas las cuantizaciones
      #       (compila bastante más lento y pesa más)
      #  CMAKE_CUDA_ARCHITECTURES           explícito: el runner no tiene GPU
      # Diferencia respecto al PKGBUILD:
      #  GGML_CUDA_NCCL=OFF  en Arch no hay NCCL instalado, así que no se enlaza;
      #       este contenedor sí lo trae y acabaría como dependencia (solo sirve multi-GPU)
      - name: Configure
        working-directory: src
        run: |
          cmake -S . -B build/linux-cuda-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_ENABLE_CUDA=ON \
            -DENGINE_ENABLE_HIP=OFF \
            -DENGINE_ENABLE_VULKAN=OFF \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON \
            -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=ON \
            -DENGINE_ENABLE_CPU_ALL_VARIANTS=ON \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCH}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build
        working-directory: src
        run: |
          cmake --build build/linux-cuda-release --parallel "$(nproc)" \
            --target audiocpp_cli --target audiocpp_server --target audiocpp_gguf

      - name: Pack artifacts
        id: pack
        working-directory: src
        run: |
          set -euo pipefail
          CLI=$(find build -type f -name audiocpp_cli | head -n1)
          BIN_DIR=$(dirname "$CLI")
          NAME="${{ steps.ver.outputs.name }}"
          SM="${{ steps.ver.outputs.arch }}"
          BASE="audio-${NAME}-bin-ubuntu-x64-cuda${CUDA_LABEL}-sm${SM}"
          RT="audio-${NAME}-cudart-ubuntu-x64-cuda${CUDA_LABEL}-sm${SM}"
          PKG="/tmp/pkg/$BASE"
          RTD="/tmp/cudart/$RT"
          rm -rf /tmp/pkg /tmp/cudart && mkdir -p "$PKG" "$RTD"

          for b in audiocpp_cli audiocpp_server audiocpp_gguf audiocpp_model_manager; do
            if [ -f "$BIN_DIR/$b" ]; then cp "$BIN_DIR/$b" "$PKG/"; fi
          done
          # Libs privadas de la build (ggml, backend CUDA, variantes de CPU...):
          # en el mismo directorio que los binarios, como hace el PKGBUILD.
          if compgen -G "$BIN_DIR/*.so*" > /dev/null; then
            cp -a "$BIN_DIR"/*.so* "$PKG/"
          fi

          # mismo contenido que el bundle de upstream / PKGBUILD
          cp LICENSE "$PKG/" || true
          cp -r tools       "$PKG/tools"       || true
          cp -r model_specs "$PKG/model_specs" || true

          echo "Contenido del paquete:"; ls -lh "$PKG"

          # Runtime CUDA: lo enlazan los binarios Y las libs (libggml-cuda.so,
          # que es lo que depende de cudart/cublas). cp -L deja ficheros planos.
          # libcuda.so.1 NO se incluye: lo aporta el driver.
          for f in "$PKG"/audiocpp_* "$PKG"/*.so*; do
            [ -f "$f" ] || continue
            ldd "$f" 2>/dev/null | awk '/=> \//{print $3}' \
              | grep -E '/lib(cudart|cublas|cublasLt|cufft)\.so' \
              | xargs -r -I{} cp -L -n {} "$RTD/" || true
          done
          echo "Runtime libs:"; ls -l "$RTD"
          if ! ls "$RTD" | grep -q '^libcudart'; then
            echo "::error::No se encontró libcudart entre las dependencias de binarios/libs"
            exit 1
          fi

          # RPATH=$ORIGIN: todo se resuelve en el mismo directorio
          for f in "$PKG"/audiocpp_* "$PKG"/*.so* "$RTD"/*.so*; do
            [ -f "$f" ] && patchelf --set-rpath '$ORIGIN' "$f" || true
          done

          # Verificación sobre binarios Y libs, con bin + cudart juntos:
          # solo se admite que falte libcuda.so.1 (driver).
          rm -rf /tmp/verify && mkdir /tmp/verify
          cp -a "$PKG"/audiocpp_* /tmp/verify/
          cp -a "$PKG"/*.so* /tmp/verify/ 2>/dev/null || true
          cp -a "$RTD"/*.so* /tmp/verify/
          : > /tmp/all.ldd
          for f in /tmp/verify/audiocpp_* /tmp/verify/*.so*; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f")" >> /tmp/all.ldd
            ldd "$f" >> /tmp/all.ldd 2>&1 || true
          done
          cat /tmp/all.ldd
          if grep 'not found' /tmp/all.ldd | grep -qv 'libcuda\.so\.1'; then
            echo "::error::hay dependencias sin resolver"
            grep 'not found' /tmp/all.ldd | grep -v 'libcuda\.so\.1'
            exit 1
          fi
          # NCCL sí está instalado en el contenedor, así que el ldd no lo marcaría
          # como faltante: comprobarlo explícitamente.
          if grep -q 'libnccl' /tmp/all.ldd; then
            echo "::error::algún binario/lib enlaza libnccl (no se empaqueta)"
            exit 1
          fi

          tar -C /tmp/pkg    -czf "$GITHUB_WORKSPACE/$BASE.tar.gz" "$BASE"
          tar -C /tmp/cudart -czf "$GITHUB_WORKSPACE/$RT.tar.gz"   "$RT"
          echo "bin=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "rt=$RT.tar.gz"    >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack.outputs.bin }}
          path: ${{ steps.pack.outputs.bin }}

      - name: Upload CUDA runtime
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pack.outputs.rt }}
          path: ${{ steps.pack.outputs.rt }}

      - name: Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audiocpp-${{ steps.ver.outputs.name }}-cuda${{ env.CUDA_LABEL }}
          name: audio.cpp ${{ steps.ver.outputs.name }} (Ubuntu x64, CUDA ${{ env.CUDA_LABEL }})
          body: |
            Build de https://github.com/${{ env.UPSTREAM_REPO }} en el commit `${{ steps.ver.outputs.sha }}`.
            CUDA archs: `${{ env.CUDA_ARCH }}`. Extrae el paquete `bin` y el `cudart` en la misma carpeta.
          files: |
            ${{ steps.pack.outputs.bin }}
            ${{ steps.pack.outputs.rt }}
